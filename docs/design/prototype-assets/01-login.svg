<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">Log in</title><desc id="desc">Reading Compass interface prototype screen</desc><rect width="1440" height="900" fill="#F3F0E7"/><rect x="0" y="0" width="1440" height="900" rx="0" fill="#173D2A" stroke="none" stroke-width="1"/><rect x="0" y="0" width="760" height="900" rx="0" fill="#214D36" stroke="none" stroke-width="1"/><text x="76" y="82" font-family="Georgia" font-size="23" font-weight="700" fill="#FFFFFF" text-anchor="start">✦  Reading Compass</text><text x="76" y="230" font-family="Georgia" font-size="50" font-weight="700" fill="#FFFFFF"><tspan x="76" dy="0">Find a book.</tspan><tspan x="76" dy="56.00000000000001">Keep your place.</tspan><tspan x="76" dy="56.00000000000001">Share the journey.</tspan></text><text x="76" y="438" font-family="Arial" font-size="20" font-weight="400" fill="#DDE8DF"><tspan x="76" dy="0">A private reading shelf and a public community,</tspan><tspan x="76" dy="27">connected through one shared catalogue.</tspan></text><rect x="850" y="100" width="500" height="700" rx="24" fill="#FFFDF8" stroke="none" stroke-width="1"/><text x="900" y="180" font-family="Georgia" font-size="36" font-weight="700" fill="#18231C" text-anchor="start">Welcome back</text><text x="900" y="214" font-family="Arial" font-size="17" font-weight="400" fill="#667168" text-anchor="start">Log in to continue your reading journey.</text><text x="900" y="270" font-family="Arial" font-size="13" font-weight="700" fill="#667168" text-anchor="start">Email</text><rect x="900" y="280" width="400" height="48" rx="10" fill="#FFFFFF" stroke="#D7DCD1" stroke-width="1"/><text x="914" y="311" font-family="Arial" font-size="16" font-weight="400" fill="#667168" text-anchor="start">reader@example.com</text><text x="900" y="370" font-family="Arial" font-size="13" font-weight="700" fill="#667168" text-anchor="start">Password</text><rect x="900" y="380" width="400" height="48" rx="10" fill="#FFFFFF" stroke="#D7DCD1" stroke-width="1"/><text x="914" y="411" font-family="Arial" font-size="16" font-weight="400" fill="#667168" text-anchor="start">••••••••••••</text><rect x="900" y="475" width="400" height="44" rx="10" fill="#376B50" stroke="#376B50" stroke-width="1"/><text x="1100" y="503" font-family="Arial" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Log in</text><text x="1100" y="555" font-family="Arial" font-size="15" font-weight="400" fill="#667168" text-anchor="middle">New to Reading Compass?</text><rect x="960" y="580" width="280" height="44" rx="10" fill="#FFFFFF" stroke="#D7DCD1" stroke-width="1"/><text x="1100" y="608" font-family="Arial" font-size="15" font-weight="700" fill="#173D2A" text-anchor="middle">Create an account</text><text x="1100" y="700" font-family="Arial" font-size="13" font-weight="400" fill="#667168" text-anchor="middle">Private shelf data is visible only to you.</text></svg>