<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">Book forum and threaded replies</title><desc id="desc">Reading Compass interface prototype screen</desc><rect width="1440" height="900" fill="#F3F0E7"/><rect x="0" y="0" width="1440" height="80" rx="0" fill="#173D2A" stroke="none" stroke-width="1"/><rect x="42" y="20" width="40" height="40" rx="20" fill="#F3E2C2" stroke="none" stroke-width="1"/><text x="62" y="47" font-family="Arial" font-size="17" font-weight="700" fill="#173D2A" text-anchor="middle">✦</text><text x="96" y="49" font-family="Georgia" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="start">Reading Compass</text><text x="560" y="46" font-family="Arial" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="start">Dashboard</text><text x="691" y="46" font-family="Arial" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="start">My books</text><text x="813" y="46" font-family="Arial" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="start">My lists</text><rect x="925" y="20" width="91" height="40" rx="8" fill="rgba(255,255,255,.12)" stroke="none" stroke-width="1"/><text x="935" y="46" font-family="Arial" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="start">Explore</text><text x="1048" y="46" font-family="Arial" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="start">Find a book</text><text x="1370" y="46" font-family="Arial" font-size="14" font-weight="700" fill="#173D2A" text-anchor="middle">AM</text><rect x="1348" y="20" width="44" height="44" rx="22" fill="#DFEADF" stroke="none" stroke-width="1"/><text x="72" y="120" font-family="Arial" font-size="14" font-weight="700" fill="#376B50" text-anchor="start">← Back to Piranesi</text><text x="72" y="175" font-family="Georgia" font-size="42" font-weight="700" fill="#18231C" text-anchor="start">Piranesi forum</text><text x="72" y="208" font-family="Arial" font-size="17" font-weight="400" fill="#667168" text-anchor="start">Book-specific discussion with threaded replies.</text><rect x="1180" y="165" width="188" height="44" rx="10" fill="#376B50" stroke="#376B50" stroke-width="1"/><text x="1274" y="193" font-family="Arial" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">New post</text><rect x="72" y="265" width="1296" height="210" rx="18" fill="#FFFDF8" stroke="#D7DCD1" stroke-width="1"/><rect x="96" y="289" width="48" height="48" rx="24" fill="#DFEADF" stroke="none" stroke-width="1"/><text x="120" y="320" font-family="Arial" font-size="14" font-weight="700" fill="#173D2A" text-anchor="middle">MC</text><text x="164" y="309" font-family="Georgia" font-size="22" font-weight="700" fill="#18231C" text-anchor="start">What did you make of the statues?</text><text x="164" y="335" font-family="Arial" font-size="13" font-weight="400" fill="#667168" text-anchor="start">Posted by Maya Chen · 4 August 2026</text><text x="164" y="377" font-family="Arial" font-size="15" font-weight="400" fill="#18231C"><tspan x="164" dy="0">I kept reading them as memory made physical. The numbering feels less like an archive</tspan><tspan x="164" dy="20.25">and more like a map of identity.</tspan></text><text x="164" y="443" font-family="Arial" font-size="14" font-weight="700" fill="#376B50" text-anchor="start">4 replies</text><rect x="1198" y="407" width="140" height="44" rx="10" fill="#FFFFFF" stroke="#D7DCD1" stroke-width="1"/><text x="1268" y="435" font-family="Arial" font-size="15" font-weight="700" fill="#173D2A" text-anchor="middle">Join thread</text><rect x="72" y="510" width="1296" height="210" rx="18" fill="#FFFDF8" stroke="#D7DCD1" stroke-width="1"/><rect x="96" y="534" width="48" height="48" rx="24" fill="#DFEADF" stroke="none" stroke-width="1"/><text x="120" y="565" font-family="Arial" font-size="14" font-weight="700" fill="#173D2A" text-anchor="middle">JB</text><text x="164" y="554" font-family="Georgia" font-size="22" font-weight="700" fill="#18231C" text-anchor="start">The final journal entries</text><text x="164" y="580" font-family="Arial" font-size="13" font-weight="400" fill="#667168" text-anchor="start">Posted by Jon Bell · 4 August 2026</text><text x="164" y="622" font-family="Arial" font-size="15" font-weight="400" fill="#18231C"><tspan x="164" dy="0">The shift in voice is subtle, but it changes how I understood the entire house.</tspan><tspan x="164" dy="20.25">Did anyone else go back to chapter one?</tspan></text><text x="164" y="688" font-family="Arial" font-size="14" font-weight="700" fill="#376B50" text-anchor="start">2 replies</text><rect x="1198" y="652" width="140" height="44" rx="10" fill="#FFFFFF" stroke="#D7DCD1" stroke-width="1"/><text x="1268" y="680" font-family="Arial" font-size="15" font-weight="700" fill="#173D2A" text-anchor="middle">Join thread</text><rect x="118" y="755" width="1180" height="88" rx="14" fill="#EEF3EC" stroke="none" stroke-width="1"/><text x="148" y="790" font-family="Arial" font-size="15" font-weight="400" fill="#173D2A" text-anchor="start">↳  A reply stays attached to its parent post and shows author and edited state.</text><text x="148" y="820" font-family="Arial" font-size="13" font-weight="400" fill="#667168" text-anchor="start">Anonymous visitors may read; signed-in readers may post and reply.</text></svg>