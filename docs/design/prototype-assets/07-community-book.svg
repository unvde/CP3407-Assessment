<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">Community book page</title><desc id="desc">Reading Compass interface prototype screen</desc><rect width="1440" height="900" fill="#F3F0E7"/><rect x="0" y="0" width="1440" height="80" rx="0" fill="#173D2A" stroke="none" stroke-width="1"/><rect x="42" y="20" width="40" height="40" rx="20" fill="#F3E2C2" stroke="none" stroke-width="1"/><text x="62" y="47" font-family="Arial" font-size="17" font-weight="700" fill="#173D2A" text-anchor="middle">✦</text><text x="96" y="49" font-family="Georgia" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="start">Reading Compass</text><text x="560" y="46" font-family="Arial" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="start">Dashboard</text><text x="691" y="46" font-family="Arial" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="start">My books</text><text x="813" y="46" font-family="Arial" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="start">My lists</text><rect x="925" y="20" width="91" height="40" rx="8" fill="rgba(255,255,255,.12)" stroke="none" stroke-width="1"/><text x="935" y="46" font-family="Arial" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="start">Explore</text><text x="1048" y="46" font-family="Arial" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="start">Find a book</text><text x="1370" y="46" font-family="Arial" font-size="14" font-weight="700" fill="#173D2A" text-anchor="middle">AM</text><rect x="1348" y="20" width="44" height="44" rx="22" fill="#DFEADF" stroke="none" stroke-width="1"/><text x="72" y="120" font-family="Arial" font-size="14" font-weight="700" fill="#376B50" text-anchor="start">← Back to Explore</text><rect x="72" y="158" width="245" height="352" rx="7" fill="#667A6B" stroke="none" stroke-width="1"/><rect x="82" y="170" width="225" height="328" rx="4" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="1"/><text x="194.5" text-anchor="middle" y="305.84000000000003" font-family="Georgia" font-size="28.175" font-weight="700" fill="#FFFFFF"><tspan x="194.5" text-anchor="middle" dy="0">PIRANESI</tspan></text><text x="360" y="170" font-family="Georgia" font-size="46" font-weight="700" fill="#18231C" text-anchor="start">Piranesi</text><text x="360" y="210" font-family="Arial" font-size="20" font-weight="400" fill="#667168" text-anchor="start">Susanna Clarke</text><text x="360" y="260" font-family="Arial" font-size="18" font-weight="700" fill="#B8833D" text-anchor="start">★★★★★  4.6</text><text x="485" y="260" font-family="Arial" font-size="15" font-weight="400" fill="#667168" text-anchor="start">12 community reviews</text><rect x="360" y="286" width="82" height="30" rx="15" fill="#F3E2C2" stroke="none" stroke-width="1"/><text x="401" y="306" font-family="Arial" font-size="13" font-weight="700" fill="#173D2A" text-anchor="middle">Fantasy</text><rect x="452" y="286" width="82" height="30" rx="15" fill="#F3E2C2" stroke="none" stroke-width="1"/><text x="493" y="306" font-family="Arial" font-size="13" font-weight="700" fill="#173D2A" text-anchor="middle">Mystery</text><text x="360" y="355" font-family="Arial" font-size="17" font-weight="400" fill="#18231C"><tspan x="360" dy="0">Piranesi's house is no ordinary building: its rooms are infinite,</tspan><tspan x="360" dy="22.950000000000003">its corridors endless, its walls lined with thousands of statues.</tspan></text><rect x="360" y="438" width="190" height="44" rx="10" fill="#376B50" stroke="#376B50" stroke-width="1"/><text x="455" y="466" font-family="Arial" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Add to my books</text><rect x="566" y="438" width="170" height="44" rx="10" fill="#FFFFFF" stroke="#D7DCD1" stroke-width="1"/><text x="651" y="466" font-family="Arial" font-size="15" font-weight="700" fill="#173D2A" text-anchor="middle">Add to a list</text><rect x="752" y="438" width="170" height="44" rx="10" fill="#FFFFFF" stroke="#D7DCD1" stroke-width="1"/><text x="837" y="466" font-family="Arial" font-size="15" font-weight="700" fill="#173D2A" text-anchor="middle">Open forum</text><text x="72" y="590" font-family="Arial" font-size="13" font-weight="700" fill="#376B50" text-anchor="start">COMMUNITY REVIEWS</text><rect x="1164" y="570" width="204" height="44" rx="10" fill="#376B50" stroke="#376B50" stroke-width="1"/><text x="1266" y="598" font-family="Arial" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Rate &amp; review</text><rect x="72" y="620" width="1296" height="170" rx="18" fill="#FFFDF8" stroke="#D7DCD1" stroke-width="1"/><text x="98" y="656" font-family="Arial" font-size="16" font-weight="700" fill="#18231C" text-anchor="start">Maya Chen</text><text x="1230" y="656" font-family="Arial" font-size="16" font-weight="700" fill="#B8833D" text-anchor="start">★★★★★</text><text x="98" y="695" font-family="Arial" font-size="16" font-weight="400" fill="#18231C"><tspan x="98" dy="0">Dreamlike, precise and quietly devastating. The setting becomes a character,</tspan><tspan x="98" dy="21.6">and the mystery rewards patience without losing its sense of wonder.</tspan></text><text x="98" y="758" font-family="Arial" font-size="13" font-weight="400" fill="#667168" text-anchor="start">3 August 2026</text></svg>