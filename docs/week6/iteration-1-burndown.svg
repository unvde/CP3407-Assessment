<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="620" viewBox="0 0 1040 620" role="img" aria-labelledby="title desc">
  <title id="title">Iteration 1 daily burndown</title>
  <desc id="desc">Ideal remaining effort decreases evenly from seven to zero. Actual remaining effort varies above the ideal line before reaching zero on Week 5 Day 1.</desc>
  <rect width="1040" height="620" fill="#ffffff"/>
  <text x="520" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#172033">Iteration 1 Daily Burndown</text>
  <text x="520" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#526078">Seven development days across Week 3–Week 5</text>

  <g stroke="#e2e7ef" stroke-width="1">
    <line x1="110" y1="470" x2="950" y2="470"/>
    <line x1="110" y1="420" x2="950" y2="420"/>
    <line x1="110" y1="370" x2="950" y2="370"/>
    <line x1="110" y1="320" x2="950" y2="320"/>
    <line x1="110" y1="270" x2="950" y2="270"/>
    <line x1="110" y1="220" x2="950" y2="220"/>
    <line x1="110" y1="170" x2="950" y2="170"/>
    <line x1="110" y1="120" x2="950" y2="120"/>
  </g>

  <line x1="110" y1="470" x2="950" y2="470" stroke="#657187" stroke-width="2"/>
  <line x1="110" y1="120" x2="110" y2="470" stroke="#657187" stroke-width="2"/>

  <g font-family="Arial, sans-serif" font-size="11" fill="#526078">
    <text x="92" y="475" text-anchor="end">0</text>
    <text x="92" y="425" text-anchor="end">1</text>
    <text x="92" y="375" text-anchor="end">2</text>
    <text x="92" y="325" text-anchor="end">3</text>
    <text x="92" y="275" text-anchor="end">4</text>
    <text x="92" y="225" text-anchor="end">5</text>
    <text x="92" y="175" text-anchor="end">6</text>
    <text x="92" y="125" text-anchor="end">7</text>
    <text x="110" y="498" text-anchor="middle"><tspan x="110">Week 3</tspan><tspan x="110" dy="13">Start</tspan></text>
    <text x="230" y="498" text-anchor="middle"><tspan x="230">Week 3</tspan><tspan x="230" dy="13">Day 1</tspan></text>
    <text x="350" y="498" text-anchor="middle"><tspan x="350">Week 3</tspan><tspan x="350" dy="13">Day 2</tspan></text>
    <text x="470" y="498" text-anchor="middle"><tspan x="470">Week 3</tspan><tspan x="470" dy="13">Day 3</tspan></text>
    <text x="590" y="498" text-anchor="middle"><tspan x="590">Week 4</tspan><tspan x="590" dy="13">Day 1</tspan></text>
    <text x="710" y="498" text-anchor="middle"><tspan x="710">Week 4</tspan><tspan x="710" dy="13">Day 2</tspan></text>
    <text x="830" y="498" text-anchor="middle"><tspan x="830">Week 4</tspan><tspan x="830" dy="13">Day 3</tspan></text>
    <text x="950" y="498" text-anchor="middle"><tspan x="950">Week 5</tspan><tspan x="950" dy="13">Day 1</tspan></text>
  </g>

  <polyline points="110,120 230,170 350,220 470,270 590,320 710,370 830,420 950,470" fill="none" stroke="#7b879c" stroke-width="5" stroke-dasharray="10 8"/>
  <polyline points="110,120 230,157.5 350,220 470,257.5 590,307.5 710,370 830,407.5 950,470" fill="none" stroke="#1769aa" stroke-width="4"/>

  <g fill="#1769aa" stroke="#ffffff" stroke-width="3">
    <circle cx="110" cy="120" r="7"/>
    <circle cx="230" cy="157.5" r="7"/>
    <circle cx="350" cy="220" r="7"/>
    <circle cx="470" cy="257.5" r="7"/>
    <circle cx="590" cy="307.5" r="7"/>
    <circle cx="710" cy="370" r="7"/>
    <circle cx="830" cy="407.5" r="7"/>
    <circle cx="950" cy="470" r="7"/>
  </g>

  <line x1="660" y1="102" x2="710" y2="102" stroke="#1769aa" stroke-width="4"/>
  <text x="720" y="107" font-family="Arial, sans-serif" font-size="14" fill="#172033">Actual remaining</text>
  <line x1="660" y1="130" x2="710" y2="130" stroke="#7b879c" stroke-width="7" stroke-dasharray="10 8"/>
  <text x="720" y="135" font-family="Arial, sans-serif" font-size="14" fill="#172033">Ideal remaining</text>

  <text x="28" y="295" transform="rotate(-90 28 295)" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#172033">Estimated development-days remaining</text>
  <text x="530" y="555" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#172033">Course point</text>
</svg>
