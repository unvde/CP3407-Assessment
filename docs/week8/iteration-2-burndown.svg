<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
  <title id="title">Iteration 2 burndown</title>
  <desc id="desc">Ideal and actual remaining development-days from Week 6 Day 1 to Week 7 Day 6.</desc>
  <rect width="900" height="500" fill="#fff"/>
  <g stroke="#d1d5db" stroke-width="1">
    <path d="M90 60V420H850" fill="none" stroke="#111827" stroke-width="2"/>
    <path d="M90 60H850M90 111H850M90 163H850M90 214H850M90 266H850M90 317H850M90 369H850"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="13" fill="#374151">
    <text x="35" y="65">7</text><text x="35" y="116">6</text><text x="35" y="168">5</text><text x="35" y="219">4</text><text x="35" y="271">3</text><text x="35" y="322">2</text><text x="35" y="374">1</text><text x="35" y="425">0</text>
    <text x="70" y="450">W6 D1</text><text x="180" y="450">W7 D1</text><text x="290" y="450">W7 D2</text><text x="400" y="450">W7 D3</text><text x="510" y="450">W7 D4</text><text x="620" y="450">W7 D5</text><text x="730" y="450">W7 D6</text>
    <text x="310" y="485" font-size="16">Course checkpoint</text>
    <text transform="translate(18 330) rotate(-90)" font-size="16">Remaining development-days</text>
  </g>
  <polyline points="90,60 217,111 343,163 470,214 597,266 723,317 850,420" fill="none" stroke="#6b7280" stroke-width="4" stroke-dasharray="9 7"/>
  <polyline points="90,60 217,73 343,124 470,214 597,317 723,394 850,420" fill="none" stroke="#2563eb" stroke-width="5"/>
  <g font-family="Arial, sans-serif" font-size="14"><text x="650" y="35" fill="#6b7280">Ideal</text><text x="735" y="35" fill="#2563eb">Actual</text></g>
</svg>
