{% extends "base.html" %}

{% block title %}Register | Reading Compass{% endblock %}

{% block content %}
<section class="auth-card">
    <p class="eyebrow">Start your reading list</p>
    <h1>Create an account</h1>

    <form method="post">
        {% csrf_token %}
        {% include "includes/form_fields.html" %}
        <button class="primary-button" type="submit">Create account</button>
    </form>

    <p class="form-footer">Already registered? <a href="{% url 'login' %}">Log in</a>.</p>
</section>
{% endblock %}
