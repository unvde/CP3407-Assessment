{% extends "base.html" %}

{% block title %}Delete note | Reading Compass{% endblock %}

{% block content %}
<section class="form-card">
    <p class="eyebrow">Confirm deletion</p>
    <h1>Delete this private note?</h1>
    <p>This removes the note from <strong>{{ object.book.title }}</strong>. This action cannot be undone.</p>

    <form method="post">
        {% csrf_token %}
        <div class="actions">
            <button class="danger-button" type="submit">Delete note</button>
            <a class="text-link" href="{{ object.book.get_absolute_url }}">Cancel</a>
        </div>
    </form>
</section>
{% endblock %}
