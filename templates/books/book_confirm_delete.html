{% extends "base.html" %}

{% block title %}Delete {{ book.title }} | Reading Compass{% endblock %}

{% block content %}
<section class="form-card">
    <p class="eyebrow">Confirm deletion</p>
    <h1>Delete “{{ book.title }}”?</h1>
    <p>This removes the book from your personal reading list. This action cannot be undone.</p>

    <form method="post">
        {% csrf_token %}
        <div class="actions">
            <button class="danger-button" type="submit">Delete book</button>
            <a class="text-link" href="{{ book.get_absolute_url }}">Cancel</a>
        </div>
    </form>
</section>
{% endblock %}
