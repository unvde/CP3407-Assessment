services:
  - type: web
    name: reading-compass
    runtime: python
    plan: free
    region: singapore
    buildCommand: ./build.sh
    startCommand: python -m gunicorn reading_compass.wsgi:application
    healthCheckPath: /health/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: reading-compass-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "True"
      - key: OPEN_LIBRARY_USER_AGENT
        value: ReadingCompass/1.0 (https://github.com/unvde/CP3407-Assessment)

databases:
  - name: reading-compass-db
    plan: free
    region: singapore
    databaseName: reading_compass
    user: reading_compass
